<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  html, body { margin: 0; height: 100%; background: #2ecc40; }
  body.placing { cursor: crosshair; }
  [hidden] { display: none !important; }
  .hud {
    position: fixed; top: calc(16px + env(safe-area-inset-top, 0px)); right: 16px; z-index: 10;
    display: flex; flex-direction: column; align-items: flex-end;
    font-family: "Press Start 2P", "Courier New", monospace; color: #1a1a1a;
  }
  .row { display: flex; gap: 10px; }
  .tab {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 16px; border: 0; border-radius: 12px;
    background: #d6d6d6; color: #1a1a1a;
    font: 400 16px "Press Start 2P", "Courier New", monospace;
    cursor: pointer;
  }
  .tab:hover { background: #cacaca; }
  .tab:focus-visible, .buy:focus-visible, .gen:focus-visible { outline: 3px solid #1a1a1a; outline-offset: 2px; }
  .tab svg { width: 24px; height: 24px; color: #e53935; }
  .money { margin-top: 10px; font-size: 16px; }
  .popup {
    margin-top: 10px;
    width: min(340px, calc(100vw - 32px)); max-height: min(70vh, 560px); overflow-y: auto;
    display: none; flex-direction: column; gap: 14px;
    background: #000; color: #fff; border-radius: 12px;
    text-align: center; padding: 16px; box-sizing: border-box;
  }
  .popup.open { display: flex; }
  .item {
    display: flex; flex-direction: column; align-items: center; gap: 12px;
    padding: 12px 0; border-bottom: 2px solid #333;
  }
  .item:last-child { border-bottom: 0; }
  .item-name { font-size: 14px; line-height: 1.5; }
  .item-info { font-size: 10px; line-height: 1.6; }
  .chance-btn { cursor: pointer; text-decoration: underline dotted; }
  .display { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .display .item-info { font-size: 12px; }
  .gen-art {
    position: relative; width: 64px; height: 64px; margin-top: 22px; border-radius: 8px;
    background: #7d7d7d; display: flex; align-items: center; justify-content: center;
    image-rendering: pixelated;
  }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .buy {
    padding: 10px 14px; border: 0; border-radius: 8px;
    background: #f2f2f2; color: #1a1a1a;
    font: 400 12px "Press Start 2P", "Courier New", monospace;
    cursor: pointer;
  }
  .buy:hover:not(:disabled) { background: #fff; }
  .buy:disabled { opacity: .5; cursor: not-allowed; }
  .empty-note { font-size: 12px; }
  .fever-overlay {
    position: fixed; inset: 0; z-index: 2; pointer-events: none;
    opacity: 0; transition: opacity 1s ease;
    background: linear-gradient(120deg, #ff3b30, #ff9500, #ffe600, #34c759, #00c7e6, #5e5ce6, #ff2d92, #ff3b30);
    background-size: 300% 300%;
    mix-blend-mode: soft-light;
  }
  .fever-overlay.active {
    opacity: .4;
    animation: feverShift 6s linear infinite;
  }
  @keyframes feverShift {
    0%   { background-position: 0% 50%; }
    100% { background-position: 100% 50%; }
  }
  @media (prefers-reduced-motion: reduce) {
    .fever-overlay.active { animation: none; opacity: .22; }
  }
  .fever-toast {
    position: fixed; left: 50%; bottom: calc(64px + env(safe-area-inset-bottom, 0px)); z-index: 15;
    transform: translateX(-50%); max-width: min(320px, calc(100vw - 32px));
    background: #000; color: #fff; padding: 10px 16px; border-radius: 8px; box-sizing: border-box;
    font: 400 10px/1.6 "Press Start 2P", "Courier New", monospace; text-align: center;
    opacity: 0; visibility: hidden; transition: opacity 1s ease, visibility 0s linear 1s; pointer-events: none;
  }
  .fever-toast.show { opacity: 1; visibility: visible; transition: opacity 1s ease, visibility 0s; }
  .alpha-overlay {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(0,0,0,.6);
    display: flex; align-items: center; justify-content: center;
    padding: 16px; box-sizing: border-box;
  }
  .alpha-overlay[hidden] { display: none; }
  .alpha-box {
    width: min(360px, 100%); background: #000; color: #fff; border-radius: 12px;
    padding: 24px 20px; box-sizing: border-box; text-align: center;
    display: flex; flex-direction: column; gap: 16px;
    font-family: "Press Start 2P", "Courier New", monospace;
  }
  .alpha-title { font-size: 16px; color: #bfff00; }
  .alpha-text { font-size: 11px; line-height: 1.7; }
  .multi { margin-top: 6px; font-size: 12px; color: #fffb00; }
  .chance-text {
    position: fixed; z-index: 20; pointer-events: none;
    color: #fff200; text-shadow: 1px 1px 0 #000;
    font: 400 10px "Press Start 2P", "Courier New", monospace;
    transform: translate(-50%, -100%);
    animation: floatUp .9s ease-out forwards;
  }
  .chance-text.win { color: #ffd600; font-size: 12px; }
  @keyframes floatUp {
    0%   { opacity: 1; transform: translate(-50%, -100%); }
    100% { opacity: 0; transform: translate(-50%, calc(-100% - 30px)); }
  }
  @media (prefers-reduced-motion: reduce) { .chance-text { animation: none; opacity: 0; } }

  .gen-icon {
    font: 400 7px "Press Start 2P", "Courier New", monospace;
    line-height: 1.5;
    color: #ffffff;
    text-align: center;
    text-shadow: 1px 1px 0 #000;
    padding: 0 4px;
    pointer-events: none;
  }
  .gen-icon.common { color: #ffffff; }
  .gen .gen-icon { font-size: 6px; }
  .gen-art:has(.common), .gen:has(.common) { background: #ababab; }
  .gen-art:has(.uncommon), .gen:has(.uncommon) { background: #8fdc8f; }
  .gen-art:has(.rare), .gen:has(.rare) { background: #4a90e2; }
  .gen-art:has(.epic), .gen:has(.epic) { background: #9b59b6; }
  .gen-art:has(.awful), .gen:has(.awful) {
    background:
      repeating-linear-gradient(45deg, rgba(255,255,255,.16) 0 2px, transparent 2px 11px),
      repeating-linear-gradient(-45deg, rgba(0,0,0,.18) 0 2px, transparent 2px 11px),
      linear-gradient(#e74c3c, #a93226);
    box-shadow: inset 0 0 0 3px #7b241c, inset 3px 3px 0 3px rgba(255,255,255,.25);
  }
  .gen-art:has(.terrible), .gen:has(.terrible) {
    background:
      repeating-linear-gradient(45deg, rgba(255,255,255,.14) 0 2px, transparent 2px 11px),
      repeating-linear-gradient(-45deg, rgba(0,0,0,.22) 0 2px, transparent 2px 11px),
      linear-gradient(#ff2a1a, #8f0a00);
    box-shadow: inset 0 0 0 3px #5c0600, inset 3px 3px 0 3px rgba(255,255,255,.22);
  }
  .gen-art:has(.legendary), .gen:has(.legendary) { background: #f1c40f; }
  .gen-art:has(.mythic), .gen:has(.mythic) {
    background: #e0342a;
    animation: mythicGlow 2.6s ease-in-out infinite;
  }
  @keyframes mythicGlow {
    0%, 100% { box-shadow: 0 0 10px 1px rgba(224, 52, 42, .5), 0 0 18px 4px rgba(224, 52, 42, .25); }
    50%      { box-shadow: 0 0 16px 3px rgba(224, 52, 42, .7), 0 0 28px 8px rgba(224, 52, 42, .4); }
  }
  @media (prefers-reduced-motion: reduce) {
    .gen-art:has(.mythic), .gen:has(.mythic) { animation: none; box-shadow: 0 0 14px 2px rgba(224, 52, 42, .55), 0 0 22px 6px rgba(224, 52, 42, .3); }
  }
  .gen-art:has(.ethereal), .gen:has(.ethereal) {
    background: #16161a;
    animation: etherealGlow 3.2s ease-in-out infinite;
  }
  @keyframes etherealGlow {
    0%   { box-shadow: 0 0 10px 2px rgba(255, 255, 255, .35), 0 0 20px 5px rgba(0, 0, 0, .55); }
    50%  { box-shadow: 0 0 14px 3px rgba(0, 0, 0, .6), 0 0 26px 8px rgba(255, 255, 255, .3); }
    100% { box-shadow: 0 0 10px 2px rgba(255, 255, 255, .35), 0 0 20px 5px rgba(0, 0, 0, .55); }
  }
  @media (prefers-reduced-motion: reduce) {
    .gen-art:has(.ethereal), .gen:has(.ethereal) { animation: none; box-shadow: 0 0 12px 2px rgba(255, 255, 255, .3), 0 0 22px 6px rgba(0, 0, 0, .5); }
  }
  .gen-art:has(.ultimate), .gen:has(.ultimate) {
    animation: ultimateFade 10s ease-in-out infinite, ultimateGlow 10s ease-in-out infinite;
  }
  @keyframes ultimateFade {
    0%   { background: #ff7a00; }
    50%  { background: #e6391f; }
    100% { background: #ff7a00; }
  }
  @keyframes ultimateGlow {
    0%   { box-shadow: 0 0 12px 2px rgba(255, 210, 0, .5), 0 0 22px 6px rgba(255, 122, 0, .3); }
    25%  { box-shadow: 0 0 13px 2px rgba(255, 160, 0, .55), 0 0 24px 7px rgba(255, 90, 0, .35); }
    50%  { box-shadow: 0 0 14px 3px rgba(255, 60, 0, .6), 0 0 26px 8px rgba(220, 30, 0, .4); }
    75%  { box-shadow: 0 0 13px 2px rgba(255, 160, 0, .55), 0 0 24px 7px rgba(255, 90, 0, .35); }
    100% { box-shadow: 0 0 12px 2px rgba(255, 210, 0, .5), 0 0 22px 6px rgba(255, 122, 0, .3); }
  }
  @media (prefers-reduced-motion: reduce) {
    .gen-art:has(.ultimate), .gen:has(.ultimate) { animation: none; background: #ff7a00; box-shadow: 0 0 14px 3px rgba(255, 150, 0, .5), 0 0 24px 7px rgba(255, 60, 0, .35); }
  }
  .gen-art:has(.hyper), .gen:has(.hyper) {
    background: var(--hyper-bg, #d32f2f);
    transition: background-color 1.5s ease;
    animation: hyperGlow 3s ease-in-out infinite;
  }
  @keyframes hyperGlow {
    0%   { box-shadow: 0 0 11px 2px rgba(255, 210, 0, .5), 0 0 20px 5px rgba(211, 47, 47, .35); }
    50%  { box-shadow: 0 0 15px 3px rgba(211, 47, 47, .6), 0 0 26px 8px rgba(255, 210, 0, .3); }
    100% { box-shadow: 0 0 11px 2px rgba(255, 210, 0, .5), 0 0 20px 5px rgba(211, 47, 47, .35); }
  }
  @media (prefers-reduced-motion: reduce) {
    .gen-art:has(.hyper), .gen:has(.hyper) { animation: none; transition: none; background: #d32f2f; box-shadow: 0 0 13px 2px rgba(255, 200, 0, .45), 0 0 22px 6px rgba(211, 47, 47, .35); }
  }
  .gen-art:has(.supreme), .gen:has(.supreme) {
    background: var(--supreme-bg, #123a8c);
    transition: background-color var(--supreme-bg-duration, 5s) ease, box-shadow var(--supreme-glow-duration, 2s) ease;
    box-shadow: 0 0 12px 2px var(--supreme-glow, #40c4ff), 0 0 24px 7px var(--supreme-glow, #0d1b4c);
  }
  @media (prefers-reduced-motion: reduce) {
    .gen-art:has(.supreme), .gen:has(.supreme) { transition: none; background: #123a8c; box-shadow: 0 0 14px 3px #40c4ff, 0 0 24px 7px #0d1b4c; }
  }
  .gen-art:has(.divine), .gen:has(.divine) {
    background: var(--divine-bg, #ffb7c5);
    transition: background-color var(--divine-bg-duration, 2.6s) ease;
    animation: divineGlow 5s ease-in-out infinite;
  }
  @keyframes divineGlow {
    0%, 100% { box-shadow: 0 0 10px 2px rgba(255, 143, 199, .55), 0 0 20px 6px rgba(255, 209, 220, .35); }
    50%      { box-shadow: 0 0 16px 3px rgba(255, 209, 220, .7), 0 0 28px 8px rgba(255, 111, 165, .4); }
  }
  @media (prefers-reduced-motion: reduce) {
    .gen-art:has(.divine), .gen:has(.divine) { animation: none; background: #ffb7c5; box-shadow: 0 0 14px 2px rgba(255, 143, 199, .55), 0 0 22px 6px rgba(255, 183, 197, .35); }
  }
  .gen-art:has(.godly), .gen:has(.godly) {
    position: relative;
    background: linear-gradient(#f2fdff, #d9f8ff);
    box-shadow: inset 0 0 0 3px #7fd3e0, inset 3px 3px 0 3px rgba(255,255,255,.55);
    animation: godlyGlow 4s ease-in-out infinite;
  }
  @keyframes godlyGlow {
    0%, 100% { box-shadow: inset 0 0 0 3px #7fd3e0, inset 3px 3px 0 3px rgba(255,255,255,.55), 0 0 12px 3px rgba(190, 245, 255, .65), 0 0 24px 7px rgba(140, 225, 245, .35); }
    50%      { box-shadow: inset 0 0 0 3px #7fd3e0, inset 3px 3px 0 3px rgba(255,255,255,.55), 0 0 18px 5px rgba(215, 252, 255, .85), 0 0 34px 11px rgba(140, 225, 245, .45); }
  }
  .gen-icon.godly { position: relative; z-index: 1; color: #0b5563; text-shadow: 0 1px 0 rgba(255,255,255,.75); }
  /* star particles: two layers of tiny twinkling stars on opposite phases */
  .gen-art:has(.godly)::before, .gen:has(.godly)::before,
  .gen-art:has(.godly)::after, .gen:has(.godly)::after {
    content: ""; position: absolute; inset: 0; z-index: 0; pointer-events: none; border-radius: inherit;
    background-repeat: no-repeat;
    filter: drop-shadow(0 0 2px #39c2e2);
  }
  .gen-art:has(.godly)::before, .gen:has(.godly)::before {
    background-image:
      radial-gradient(circle, #ffffff 0 1.6px, #4cc9e6 2.3px, transparent 3.6px),
      radial-gradient(circle, #ffffff 0 1.1px, #4cc9e6 1.8px, transparent 3.1px),
      radial-gradient(circle, #ffffff 0 1.4px, #4cc9e6 2.1px, transparent 3.4px);
    background-size: 10px 10px, 8px 8px, 9px 9px;
    background-position: 14% 18%, 78% 30%, 40% 86%;
    animation: godlyTwinkleA 2.4s ease-in-out infinite;
  }
  .gen-art:has(.godly)::after, .gen:has(.godly)::after {
    background-image:
      radial-gradient(circle, #ffffff 0 1.3px, #4cc9e6 2.0px, transparent 3.3px),
      radial-gradient(circle, #ffffff 0 1.7px, #4cc9e6 2.4px, transparent 3.7px),
      radial-gradient(circle, #ffffff 0 1px, #4cc9e6 1.7px, transparent 3.0px);
    background-size: 9px 9px, 10px 10px, 8px 8px;
    background-position: 70% 78%, 24% 52%, 88% 10%;
    animation: godlyTwinkleB 3.1s ease-in-out infinite;
  }
  @keyframes godlyTwinkleA {
    0%, 100% { opacity: .2; transform: scale(.94); }
    50%      { opacity: 1;  transform: scale(1.04); }
  }
  @keyframes godlyTwinkleB {
    0%, 100% { opacity: 1;  transform: scale(1.04); }
    50%      { opacity: .2; transform: scale(.94); }
  }
  @media (prefers-reduced-motion: reduce) {
    .gen-art:has(.godly), .gen:has(.godly) { animation: none; box-shadow: inset 0 0 0 3px #7fd3e0, inset 3px 3px 0 3px rgba(255,255,255,.55), 0 0 16px 4px rgba(200, 248, 255, .75), 0 0 28px 8px rgba(140, 225, 245, .4); }
    .gen-art:has(.godly)::before, .gen:has(.godly)::before,
    .gen-art:has(.godly)::after, .gen:has(.godly)::after { animation: none; opacity: .8; }
  }
  .gen-art:has(.alpha), .gen:has(.alpha) {
    background:
      repeating-linear-gradient(45deg, rgba(255,255,255,.16) 0 2px, transparent 2px 11px),
      repeating-linear-gradient(-45deg, rgba(0,0,0,.2) 0 2px, transparent 2px 11px),
      linear-gradient(#ff4d4d, #a30000);
    box-shadow: inset 0 0 0 3px #7a0c0c, inset 3px 3px 0 3px rgba(255,255,255,.22);
    animation: alphaGlow 3s ease-in-out infinite;
  }
  @keyframes alphaGlow {
    0%, 100% { box-shadow: inset 0 0 0 3px #7a0c0c, inset 3px 3px 0 3px rgba(255,255,255,.22), 0 0 10px 2px rgba(211, 47, 47, .55); }
    50%      { box-shadow: inset 0 0 0 3px #7a0c0c, inset 3px 3px 0 3px rgba(255,255,255,.22), 0 0 18px 5px rgba(255, 90, 90, .7); }
  }
  @media (prefers-reduced-motion: reduce) {
    .gen-art:has(.alpha), .gen:has(.alpha) { animation: none; box-shadow: inset 0 0 0 3px #7a0c0c, inset 3px 3px 0 3px rgba(255,255,255,.22), 0 0 14px 3px rgba(211, 47, 47, .6); }
  }
  /* Early Alpha 3.5-block radius aura: brighter red fill at 0.3, faint red edge/glow at 0.7,
     swelling once every 10 seconds. Sits behind all gens so it never hides them. */
  .alpha-aura {
    position: absolute; left: 50%; top: 50%; z-index: -1; transform: translate(-50%, -50%);
    border-radius: 50%; box-sizing: border-box; pointer-events: none;
    background: rgba(255, 60, 60, .3);
    border: 2px solid rgba(255, 90, 90, .7);
    box-shadow: 0 0 14px 2px rgba(255, 90, 90, .7);
    animation: alphaAuraPulse 10s ease-in-out infinite;
  }
  @keyframes alphaAuraPulse {
    0%, 70%, 100% { box-shadow: 0 0 14px 2px rgba(255, 90, 90, .7); filter: brightness(1); }
    85%           { box-shadow: 0 0 44px 14px rgba(255, 90, 90, .7); filter: brightness(1.25); }
  }
  @media (prefers-reduced-motion: reduce) { .alpha-aura { animation: none; } }
  .gen-art:has(.magnet), .gen:has(.magnet) { background: transparent; }
  .gen-art:has(.pulse), .gen:has(.pulse) { background: transparent; }
  .gen-art:has(.wood), .gen:has(.wood) {
    background:
      repeating-linear-gradient(90deg, transparent 0 5px, rgba(110,66,28,.24) 5px 6px, transparent 6px 11px, rgba(110,66,28,.12) 11px 12px, transparent 12px 19px),
      repeating-linear-gradient(0deg, rgba(255,255,255,.07) 0 2px, transparent 2px 7px),
      linear-gradient(#dcae78, #c99859);
    box-shadow: inset 0 0 0 3px #a8743c, inset 3px 3px 0 3px rgba(255,255,255,.22);
  }
  .gen-art:has(.stone), .gen:has(.stone) {
    background:
      repeating-linear-gradient(0deg, rgba(0,0,0,.22) 0 2px, transparent 2px 16px),
      repeating-linear-gradient(90deg, rgba(0,0,0,.16) 0 2px, transparent 2px 18px),
      linear-gradient(#b7b7b7, #8f8f8f);
    box-shadow: inset 0 0 0 3px #6e6e6e, inset 3px 3px 0 3px rgba(255,255,255,.18);
  }
  .gen-icon svg { display: block; }
  .xp { margin-top: 10px; display: flex; align-items: center; gap: 10px; }
  .lvl {
    min-width: 32px; height: 32px; padding: 0 4px; box-sizing: border-box;
    background: #ffffff; color: #1a1a1a; border: 2px solid #1a1a1a;
    display: flex; align-items: center; justify-content: center; font-size: 14px;
  }
  .xp-col { display: flex; flex-direction: column; gap: 4px; }
  .rebirth-badge { color: #1a1a1a; font-size: 10px; }
  .xp-bar { width: 140px; height: 14px; box-sizing: border-box; background: #1a1a1a; border: 2px solid #1a1a1a; }
  .xp-fill { height: 100%; width: 0; background: #bfff00; transition: width .2s; }
  .xp-text { font-size: 8px; }
  @media (prefers-reduced-motion: reduce) { .xp-fill { transition: none; } }
  .persec { margin-top: 6px; font-size: 10px; }
  .section-title {
    text-align: left; font-size: 14px; color: #bfff00;
    padding-bottom: 8px; border-bottom: 2px solid #bfff00;
  }
  .shop-tabs { display: flex; gap: 8px; }
  .shop-tabs .buy { flex: 1; }
  .shop-tabs .buy.active { background: #bfff00; color: #1a1a1a; }
  .pulse-icon { position: relative; width: 54px; height: 54px; perspective: 220px; }
  .pulse-pad { position: absolute; left: 0; top: 0; }
  .pulse-cube {
    position: absolute; left: 50%; top: 36%; width: 26px; height: 26px; margin: -13px 0 0 -13px;
    background: linear-gradient(135deg, rgba(143,208,236,.6), rgba(216,242,251,.4)),
      linear-gradient(0deg, transparent 45%, rgba(216,242,251,.6) 50%, transparent 55%),
      linear-gradient(90deg, transparent 45%, rgba(216,242,251,.6) 50%, transparent 55%);
    border: 1px solid #d8f2fb; border-radius: 3px;
    transform-style: preserve-3d;
    animation: pulseSpin 4.5s ease-in-out infinite;
  }
  @keyframes pulseSpin {
    0%   { transform: translateY(0)    rotate(10deg) rotateY(0deg)   rotateX(-6deg); }
    25%  { transform: translateY(-2px) rotate(18deg) rotateY(90deg)  rotateX(6deg); }
    50%  { transform: translateY(0)    rotate(26deg) rotateY(180deg) rotateX(-6deg); }
    75%  { transform: translateY(-2px) rotate(18deg) rotateY(270deg) rotateX(6deg); }
    100% { transform: translateY(0)    rotate(10deg) rotateY(360deg) rotateX(-6deg); }
  }
  @media (prefers-reduced-motion: reduce) { .pulse-cube { animation: none; transform: rotate(18deg); } }
  .gen.pulse-holding { box-shadow: 0 0 0 3px rgba(143,208,236,0); transition: box-shadow 3s linear; }
  .gen.pulse-holding.charging { box-shadow: 0 0 0 3px rgba(143,208,236,.9); }
  .pulse-wave {
    position: fixed; z-index: 3; pointer-events: none;
    left: 0; top: 0; width: 20px; height: 20px; margin-left: -10px; margin-top: -10px;
    border: 3px solid #8fd0ec; border-radius: 50%;
    animation: pulseWave .7s ease-out forwards;
  }
  @keyframes pulseWave {
    from { transform: scale(0); opacity: .9; }
    to   { transform: scale(var(--wave-scale, 8)); opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) { .pulse-wave { animation: none; display: none; } }
  .boost-bar {
    position: fixed; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px));
    z-index: 9; pointer-events: none;
    display: flex; gap: 6px; align-items: flex-end;
  }
  .boost-badge.surge { background: #fff6bf; border-color: #e6b800; order: 2; }
  .boost-badge.fever { background: #ffe3cc; border-color: #ff8a3d; order: 1; }

  /* ---------- Layout helpers (desktop safety) ---------- */
  :root { --view-scale: 1; --nav-h: 60px; }
  html { overscroll-behavior: none; }
  .row { flex-wrap: wrap; justify-content: flex-end; }
  .tab .short { display: none; }

  /* ---------- Mobile layout: bottom button bar, compact stats strip, zoomed play area ---------- */
  body.mobile {
    touch-action: manipulation; -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none; user-select: none; overscroll-behavior: none;
  }
  body.mobile .gen { -webkit-touch-callout: none; }
  /* Layout: hud on top, a big scrollable play field in the middle, button bar fixed to the bottom.
     The field is much larger than the screen (see --field-w/--field-h, set from JS) so mobile gets
     a play area close to a desktop's rather than one that's squeezed into a single small screen. */
  body.mobile { display: flex; flex-direction: column; height: 100vh; height: 100dvh; overflow: hidden; }
  body.mobile .field-scroll {
    order: 2; position: static; flex: 1 1 auto; min-height: 0;
    overflow: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
    background: #2ecc40;
  }
  body.mobile .field {
    position: relative; inset: auto;
    width: var(--field-w, 100%); height: var(--field-h, 100%);
  }
  /* Stats: one slim strip across the top, in normal flow above the field */
  body.mobile .hud {
    order: 1; position: static; box-sizing: border-box;
    padding: calc(6px + env(safe-area-inset-top, 0px)) 10px 6px;
    flex-direction: row; flex-wrap: wrap; align-items: center; justify-content: space-between;
    gap: 2px 10px;

  }
  body.mobile .xp { margin-top: 0; gap: 6px; }
  body.mobile .lvl { min-width: 26px; height: 26px; font-size: 11px; }
  body.mobile .xp-bar { width: 84px; height: 10px; }
  body.mobile .money { margin-top: 0; font-size: 11px; }
  body.mobile .persec { margin-top: 0; font-size: 8px; }
  body.mobile .multi { margin-top: 0; font-size: 9px; color: #6b5d00; }
  /* Buttons: fixed bottom bar, always fully visible, thumb-sized */
  body.mobile .row {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 11; box-sizing: border-box;
    display: grid; grid-template-columns: 46px repeat(4, minmax(0, 1fr)); gap: 6px;
    padding: 8px 8px calc(8px + env(safe-area-inset-bottom, 0px));
    background: rgba(190,190,190,.97); border-radius: 14px 14px 0 0;
  }
  body.mobile .tab {
    justify-content: center; min-height: 44px; padding: 0 2px; gap: 4px;
    font-size: 8px; white-space: nowrap; border-radius: 10px;

  body.mobile .tab .full { display: none; }
  body.mobile .tab .short { display: inline; }
  /* Popups: open just above the button bar, nearly full width */
  body.mobile .popup {
    position: fixed; left: 8px; right: 8px; width: auto; margin: 0; z-index: 12;
    bottom: calc(var(--nav-h) + 8px + env(safe-area-inset-bottom, 0px));
    max-height: calc(100vh - var(--nav-h) - 110px - env(safe-area-inset-bottom, 0px));
    max-height: calc(100dvh - var(--nav-h) - 110px - env(safe-area-inset-bottom, 0px));
    overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
  }
  body.mobile .buy { min-height: 40px; }

  body.mobile .hint { bottom: calc(var(--nav-h) + 8px + env(safe-area-inset-bottom, 0px)); max-width: calc(100vw - 16px); }
  body.mobile .boost-bar { right: 8px; bottom: calc(var(--nav-h) + 8px + env(safe-area-inset-bottom, 0px)); }

  .falling-star {
    position: fixed; z-index: 15; pointer-events: auto; cursor: pointer; user-select: none;
    -webkit-tap-highlight-color: transparent; transform: translate(-50%, -50%);
    font-size: 84px; line-height: 1; will-change: transform, opacity;
    animation: starDrop .6s ease-out forwards, starTwinkle 2s ease-in-out .6s infinite;
    filter: drop-shadow(0 0 10px rgba(255, 230, 150, .85));
    transition: opacity .5s ease;
  }
  .falling-star.hyper {
    animation: starDrop .6s ease-out forwards, hyperHue 3s linear .6s infinite;
    filter: drop-shadow(0 0 14px rgba(255, 255, 255, .9));
  }
  .falling-star.hyper.collected { animation: starCollect 2s ease-out forwards, hyperHue 3s linear infinite; }
  @keyframes hyperHue {
    0%   { filter: hue-rotate(0deg)   saturate(1.6) drop-shadow(0 0 14px rgba(255, 255, 255, .9)); }
    100% { filter: hue-rotate(360deg) saturate(1.6) drop-shadow(0 0 14px rgba(255, 255, 255, .9)); }
  }
  .falling-star.sonic {
    animation: starDrop .6s ease-out forwards, sonicGlow 3s ease-in-out .6s infinite;
    filter: hue-rotate(150deg) saturate(1.5) drop-shadow(0 0 14px #00e5ff);
  }
  .falling-star.sonic.collected { animation: starCollect 2s ease-out forwards, sonicGlow 3s ease-in-out infinite; }
  /* like the Supreme generator, but leaning cyan: the glow drifts between light blue, cyan and deep blue */
  @keyframes sonicGlow {
    0%, 100% { filter: hue-rotate(140deg) saturate(1.5) drop-shadow(0 0 12px #00e5ff); }
    33%      { filter: hue-rotate(160deg) saturate(1.5) drop-shadow(0 0 22px #80d8ff); }
    66%      { filter: hue-rotate(148deg) saturate(1.6) brightness(.9) drop-shadow(0 0 16px #1565c0); }
  }
  .pulse-wave.sonic-wave { border-color: #00e5ff; z-index: 14; }
  .falling-star.collected { pointer-events: none; animation: starCollect 2s ease-out forwards; }
  @keyframes starCollect {
    0%   { opacity: 1; }
    100% { opacity: 0; }
  }
  .falling-star.fading { opacity: 0; animation-play-state: paused; pointer-events: none; }
  @keyframes starDrop {

    100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }

  @keyframes starTwinkle {

    .falling-star.sonic.collected { animation: starCollect 2s ease-out forwards; }
  }

    // guards below using it) to bring back the Cash and Reset dev tools for normal development
    var ALPHA_BUILD = false;

    var money = 10;
    var tix = 0;
    var pulseTokens = 0; // only earned once rebirthCount >= 4, shown only in the Pulse tree
    var pulseRangeBought = false;
    var pulseQuestDone = false; // "Pulse 20 gens at once" — required before the Pulse Range upgrade
    var pulseQuestBest = 0; // highest number of gens boosted by a single pulse so far

    // Personal Fever: fills as you collect notes, triggers a 2x note-speed
    // event once it reaches 10,000, then resets and starts filling again
    var FEVER_TARGET = 10000;

    var feverProgress = 0;
    var feverActive = false;
    var SURGE_DURATION = 60 * 1000, SURGE_MULT = 1.4; // Star Surge: notes 1.4x faster for 1 minute
    var surgeActive = false, surgeUntil = 0;
    var starsCollected = 0, hyperStarsCollected = 0;
    var HYPER_DURATION = 5 * 60 * 1000, HYPER_MULT = 1.5, HYPER_CHANCE = 0.10; // Hyper Star
    var hyperActive = false, hyperUntil = 0;
    var SONIC_DURATION = 5 * 60 * 1000, SONIC_MULT = 2, SONIC_CHANCE = 0.02; // Sonic Star (2% of spawns)
    var sonicActive = false, sonicUntil = 0, sonicStarsCollected = 0;
    var feverUntil = 0;
    var feverToastTimer = null;
    var PULSE_RANGE_COST = { tokens: 20, tix: 3000000 };
    var PULSE_RANGE_BONUS = 28; // +0.5 block (a block is 56px)
    var noteInterval = 1000; // ms per note
    var noteSpeedLevel = 0; // 0-5, each level drops noteInterval
    var NOTE_SPEED = [
      { cost: 1000,    interval: 950 }, // Lv1
      { cost: 15000,   interval: 900 }, // Lv2
      { cost: 150000,  interval: 850 }, // Lv3
      { cost: 1000000, interval: 800 }, // Lv4
      { cost: 5000000, interval: 760 }  // Lv5
    ];
    var discountLevel = 0; // 0-13, each tier makes every generator 1% cheaper
    var DISCOUNT_MAX = 13;
    var DISCOUNT_COST = [];
    (function () {
      var cost = 100000;
      for (var i = 0; i < DISCOUNT_MAX; i++) { DISCOUNT_COST.push(cost); cost *= 5; }
    })();
    function genPrice(t) {
      if (t.tixOnly) return 0;
      return Math.max(1, Math.round(t.price * Math.pow(0.99, discountLevel)));
    }
    var multi = 0; // +1 each time a multi roll lands (= +0.01x); income = rate * (1 + multi * 0.01)
    var owned = {}; // id -> count in inventory
    TYPES.forEach(function (t) { owned[t.id] = 0; });
    // 'alpha' gens are not sold in the shop - they are only obtained by redeeming codes

    var gens = [], blocks = [], placing = false, placingType = null, ghost = null;

    var invPopup = $('invPopup'), shopPopup = $('shopPopup'), upgPopup = $('upgPopup'), rebirthPopup = $('rebirthPopup');
    var moneyEl = $('money'), perSecEl = $('perSec'), placedEl = $('placedCount');
    var field = $('field'), hint = $('hint');

function isMobile() { return document.body.classList.contains('mobile'); }
    var deviceType = null; // 'pc' or 'mobile'
    // How much bigger the mobile play field is than the visible screen, in each direction.
    // >1 gives mobile real extra room (reached by scrolling) instead of just shrinking generators.
    var MOBILE_FIELD_MULT_X = 1.8, MOBILE_FIELD_MULT_Y = 2.2;
    var fieldScroll = $('fieldScroll');
    function applyLayout(mobile) {
      document.body.classList.toggle('mobile', mobile);
      if (mobile) {
        var w = Math.round(window.innerWidth * MOBILE_FIELD_MULT_X);
        var h = Math.round(window.innerHeight * MOBILE_FIELD_MULT_Y);
        document.documentElement.style.setProperty('--field-w', w + 'px');
        document.documentElement.style.setProperty('--field-h', h + 'px');
      }
    }
    // Guess from the screen first; the device picker below overrides it
    applyLayout((window.matchMedia && window.matchMedia('(pointer: coarse)').matches) || window.innerWidth <= 700);
    window.addEventListener('resize', function () { if (isMobile()) applyLayout(true); });
    $('devicePc').addEventListener('click', function () {

    // Long-pressing a generator (the Pulse needs a 3s hold) shouldn't open a context menu
    document.addEventListener('contextmenu', function (e) { if (e.target.closest && e.target.closest('.gen')) e.preventDefault(); });

    // Format big numbers: 1e21 -> "1sx"
    var SUFFIXES = [[1e21,'sx'],[1e18,'qi'],[1e15,'qa'],[1e12,'t'],[1e9,'b'],[1e6,'m']];
    function fmt(n) {
      for (var i = 0; i < SUFFIXES.length; i++) {
        if (n >= SUFFIXES[i][0]) return parseFloat((n / SUFFIXES[i][0]).toFixed(2)) + SUFFIXES[i][1];
      }
      return String(Math.floor(n));
    }

    // Compact k/m/b/q rounding used on the note bubbles above each gen
    var NOTE_SUFFIXES = [[1e15,'q'],[1e9,'b'],[1e6,'m'],[1e3,'k']];
    function fmtNote(n) {
      for (var i = 0; i < NOTE_SUFFIXES.length; i++) {
        if (n >= NOTE_SUFFIXES[i][0]) return parseFloat((n / NOTE_SUFFIXES[i][0]).toFixed(2)) + NOTE_SUFFIXES[i][1];
      }
      return String(Math.floor(n));
    }

    function typeById(id) {
      for (var i = 0; i < TYPES.length; i++) if (TYPES[i].id === id) return TYPES[i];
      return null;
    }

    function iconHTML(t) {
      if (t.icon) return '<div class="gen-icon ' + t.cls + '">' + t.icon + '</div>';
      return '<div class="gen-icon ' + t.cls + '">' + t.name.split(' ').join('<br>') + '</div>';
    }
    function infoText(t) {
      if (t.info) return t.info;
      if (t.kind === 'block') return 'Collects cash from<br>gens nearby';
      if (t.bestMult) return 'Makes ' + t.bestMult + 'x your best<br>placed gen';
      return t.currency === 'tix' ? t.rate + ' Tix per second' : '$' + t.rate + ' a sec';
    }
    function buyLabel(t) {
      if (t.tixOnly) return 'Buy ' + fmt(t.priceTix) + ' Tix';

    }
    function sellLabel(t) {

      return 'Sell $' + fmt(t.sell) + (t.sellTix ? ' + ' + fmt(t.sellTix) + ' Tix' : '');

    function noteHTML(t, n) {
      if (t.kind !== 'gen') return '';
      var val = t.currency === 'tix' ? fmtNote(t.rate) + ' Tx' : '$' + fmtNote(t.rate);
      var cls = t.currency === 'tix' ? ' tix' : '';
      return '<div class="notes"><span class="note-count">x' + fmtNote(n) + '</span><span class="note' + cls + '"><span class="note-val">' + val + '</span></span></div>';

    function ringHTML(t) {
      if (t.auraRadius) return '<span class="alpha-aura" style="width:' + (t.auraRadius * 2) + 'px;height:' + (t.auraRadius * 2) + 'px"></span>';
      return t.radius ? '<span class="range" style="width:' + (t.radius * 2) + 'px;height:' + (t.radius * 2) + 'px"></span>' : '';
    }

    var shopFilter = 'gen';
    function buildShop() {
      shopPopup.innerHTML = '';
      var tabs = document.createElement('div');
      tabs.className = 'shop-tabs';
      tabs.innerHTML =
        '<button class="buy' + (shopFilter === 'gen' ? ' active' : '') + '" data-shop-filter="gen" type="button">Generators</button>' +
        '<button class="buy' + (shopFilter === 'block' ? ' active' : '') + '" data-shop-filter="block" type="button">Walls</button>' +
        (rebirthCount >= 1 ? '<button class="buy' + (shopFilter === 'tix' ? ' active' : '') + '" data-shop-filter="tix" type="button">Tix</button>' : '');
      shopPopup.appendChild(tabs);
      TYPES.forEach(function (t) {
        if (t.hideFromShop) return;
        var section = t.currency === 'tix' ? 'tix' : t.kind;
        if (section !== shopFilter) return;
        var item = document.createElement('div');
        item.className = 'item';
        item.innerHTML =
          '<div class="item-name">' + t.name + '</div>' +
          '<div class="display">' +
            '<div class="gen-art">' + iconHTML(t) + noteHTML(t, 1) + '</div>' +
            '<div class="item-info' + (t.kind === 'gen' ? ' chance-btn' : '') + '" data-id="' + t.id + '" data-action="chance">' + infoText(t) + '</div>' +
          '</div>' +
          '<button class="buy" data-id="' + t.id + '" data-action="buy">' + buyLabel(t) + '</button>';
        shopPopup.appendChild(item);
      });
    }
    shopPopup.addEventListener('click', function (e) {
      var tabBtn = e.target.closest('[data-shop-filter]');
      if (!tabBtn) return;
      shopFilter = tabBtn.getAttribute('data-shop-filter');
      buildShop();
      render();
    });

    function buildInventoryRow(t) {
      var item = document.createElement('div');
      item.className = 'item';
      item.innerHTML =
        '<div class="item-name">' + t.name + ' x' + owned[t.id] + '</div>' +
        '<div class="display">' +
          '<div class="gen-art">' + iconHTML(t) + noteHTML(t, 1) + '</div>' +
          '<div class="item-info">' + infoText(t) + '</div>' +
        '</div>' +
        '<div class="actions">' +
          '<button class="buy" data-id="' + t.id + '" data-action="place"' + (atGenLimit(t) ? ' disabled' : '') + '>Place</button>' +
          '<button class="buy" data-id="' + t.id + '" data-action="sell">' + sellLabel(t) + '</button>' +
        '</div>';
      return item;
    }

    function updateXp() {
      $('lvlNum').textContent = level;
      $('xpFill').style.width = Math.min(100, xp / xpNeed * 100) + '%';
      $('xpText').textContent = xp + '/' + xpNeed + ' XP';
    }

    // Keep the $ tag visually the same size as "$1" even when the number gets long
    function setNoteVal(el, text) {
      if (el.textContent === text) return;
      el.textContent = text;
      var len = text.length;
      var size = len <= 4 ? 11 : len === 5 ? 10 : len === 6 ? 9 : len === 7 ? 8 : 7;
      el.style.fontSize = size + 'px';
    }

    function addXp(n) {
      var before = level;
      xp += Math.ceil(n * (1 + rebirthCount * 0.04));
      while (xp >= xpNeed) {
        xp -= xpNeed;
        level += 1;
        xpNeed = Math.round(xpNeed * 1.3);
      }
      updateXp();
      if (level !== before) render(); // new slot: refresh Placed x/y and Place buttons
    }

    // Each gen earns from its own clock: 1 note per second since it was placed (or last collected)
    function curInterval(o) {
      var iv = (o.boostUntil && Date.now() < o.boostUntil) ? noteInterval * 0.75 : noteInterval;
      if (feverActive) iv *= 0.5; // personal fever: notes twice as fast
      if (surgeActive) iv /= SURGE_MULT; // Star Surge: 1.4x faster, stacks with everything above
      if (hyperActive) iv /= HYPER_MULT; // Hyper Star: 1.5x faster, stacks with everything above
      if (sonicActive) iv /= SONIC_MULT; // Sonic Star: 2x faster, stacks with everything above
      return iv;
    }
    function pending(o) { return Math.max(0, Math.floor((Date.now() - o.t0) / curInterval(o))); }

    function updateMulti() {
      $('multi').textContent = 'Multi x' + (1 + multi * 0.01).toFixed(2);
      gens.forEach(function (o) {
        var t = typeById(o.typeId);
        setNoteVal(o.val, noteText(o));
      });
    }

    // Chance to gain a multi level. Basic starts at 1/100 (M = 1) and D grows toward
    //   FORMULA(M) = 485.26 * M^1.5067 + 2003.09   (chance = 1 / D)
    // M = 1 + multi * 0.01 is also the income multiplier: each trigger adds +0.01x and the
    // chance shifts a little on every single trigger. The start-up offset fades out
    // as M rises (DECAY = how slowly it fades - raise it to blend in slower).
    function baseMultiChance() {
      var M = 1 + multi * 0.01;
      var DECAY = 10;
      var full = 485.26 * Math.pow(M, 1.5067) + 2003.09;
      var start = 485.26 + 2003.09 - 100; // gap between the formula at M=1 and D=100
      var D = full - start * Math.exp(-(M - 1) / DECAY);
      return 1 / D;
    }
    function fmtChance(p) {
      if (p <= 0) return '1/∞';
      if (p >= 1) return '1/1';
      return '1/' + fmt(1 / p);
    }
    function multiChance(t) {
      var base = baseMultiChance();
      var tier = (t.ease || 1.21) / 1.21; // every tier's bonus, relative to Basic
      var eased = base * tier * (1 + rebirthCount * 0.03);
      return Math.max(0, Math.min(1, eased));
    }

    // Field-local (x,y) -> viewport coords, accounting for the mobile field's scroll position.
    // Identity on desktop, where the field's box already equals the viewport.
    function toScreen(x, y) {
      if (!isMobile()) return { x: x, y: y };
      var r = fieldScroll.getBoundingClientRect();
      return { x: r.left + x - fieldScroll.scrollLeft, y: r.top + y - fieldScroll.scrollTop };
    }

    function floatText(text, x, y) {
      var p = toScreen(x, y);
      var el = document.createElement('div');
      el.className = 'chance-text win';
      el.style.left = p.x + 'px';
      el.style.top = p.y + 'px';
      el.textContent = text;
      document.body.appendChild(el);
      setTimeout(function () { el.remove(); }, 900);
    }

    // Only a direct collect (a click, or a hammer pickup) gets a roll -
    // a magnet auto-collecting in the background doesn't.
    function rollMulti(t, x, y) {
      if (Math.random() < multiChance(t)) {
        multi += 1;
        formula_use.u(1); // reported as a legitimate multi gain
        updateMulti();
        floatText('MULTI +1!', x, y - 34);
      }
    }

    function showToast(elId, msg, duration) {
      var el = $(elId);
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(el._toastTimer);
      el._toastTimer = setTimeout(function () { el.classList.remove('show'); }, duration || 4000);
    }

    // Every 3 minutes, a star emoji drops in at a random spot and stays there a while;
    // a toast confirms once it fades out ("falls").
    var STAR_INTERVAL = 3 * 60 * 1000;
    var STAR_SIZE = 84; // 3x the original 28px
    // force: undefined = roll normally, true = hyper, 'sonic' = sonic (dev tools).
    // Rolls: 2% sonic, 10% hyper (rainbow), otherwise a regular star.
    function spawnFallingStar(force) {
      var roll = Math.random();
      var sonic = force === 'sonic' || (force === undefined && roll < SONIC_CHANCE);
      var hyper = !sonic && (force === true || (force === undefined && roll < SONIC_CHANCE + HYPER_CHANCE));
      var star = document.createElement('div');
      star.className = 'falling-star' + (hyper ? ' hyper' : '') + (sonic ? ' sonic' : '');
      star.textContent = '\u2B50';
      var margin = STAR_SIZE / 2 + 8;
      var x = margin + Math.random() * Math.max(0, window.innerWidth - margin * 2);
      var y = margin + Math.random() * Math.max(0, window.innerHeight - margin * 2);
      var stay = 60; // despawns after 60s
      star.style.left = x + 'px';
      star.style.top = y + 'px';
      document.body.appendChild(star);
      var claimed = false;
      // a sonic star sends out a pulse ring every 2 seconds, like a Pulse block
      var sonicTimer = null;
      function sonicRing() {
        var ring = document.createElement('div');
        ring.className = 'pulse-wave sonic-wave';
        ring.style.left = x + 'px';
        ring.style.top = y + 'px';
        ring.style.setProperty('--wave-scale', 10);
        document.body.appendChild(ring);
        setTimeout(function () { ring.remove(); }, 700);
      }
      if (sonic) {
        setTimeout(sonicRing, 600); // first ring once it has landed
        sonicTimer = setInterval(sonicRing, 2000);
      }
      star.addEventListener('click', function () {
        if (claimed) return;
        claimed = true;
        if (sonicTimer) clearInterval(sonicTimer);
        star.classList.add('collected'); // starts fading out slowly right away
        setTimeout(function () { star.remove(); }, 2000);
        if (sonic) startSonic(); else if (hyper) startHyper(); else startSurge();
      });
      setTimeout(function () {
        if (claimed) return;
        if (sonicTimer) clearInterval(sonicTimer);
        star.classList.add('fading');
        setTimeout(function () {
          if (claimed) return;
          star.remove();
          showToast('starToast', sonic ? 'A sonic star has fallen!' : hyper ? 'A hyper star has fallen!' : 'A star has fallen!');
        }, 500);
      }, stay * 1000);
    }

    // Star Surge: change the note speed without gaining or losing any notes already earned
    function rebaseGens(change) {
      var olds = gens.map(function (o) { return pending(o); });
      change();
      var now = Date.now();
      gens.forEach(function (o, i) { o.t0 = now - olds[i] * curInterval(o); });
    }
    function startSurge() {
      surgeUntil = Date.now() + SURGE_DURATION; // grabbing another star just refreshes the timer
      if (!surgeActive) rebaseGens(function () { surgeActive = true; });
      starsCollected += 1;
      showToast('starToast', 'You collected a star!', 5000);
      updateBoostBar();
      if (invView === 'stats') render();
    }
    function startHyper() {
      hyperUntil = Date.now() + HYPER_DURATION; // another hyper star just refreshes the timer
      if (!hyperActive) rebaseGens(function () { hyperActive = true; });
      starsCollected += 1;
      hyperStarsCollected += 1;
      showToast('starToast', 'You collected a HYPER star!', 5000);
      updateBoostBar();
      if (invView === 'stats') render();
    }
    function endHyper() {
      if (!hyperActive) return;
      rebaseGens(function () { hyperActive = false; });
      showToast('starToast', 'Hyper Star has ended.', 4000);
      updateBoostBar();
    }
    function startSonic() {
      sonicUntil = Date.now() + SONIC_DURATION; // another sonic star just refreshes the timer
      if (!sonicActive) rebaseGens(function () { sonicActive = true; });
      starsCollected += 1;
      sonicStarsCollected += 1;
      showToast('starToast', 'You collected a SONIC star!', 5000);
      updateBoostBar();
      if (invView === 'stats') render();
    }
    function endSonic() {
      if (!sonicActive) return;
      rebaseGens(function () { sonicActive = false; });
      showToast('starToast', 'Sonic Star has ended.', 4000);
      updateBoostBar();
    }
    function endSurge() {
      if (!surgeActive) return;
      rebaseGens(function () { surgeActive = false; });
      showToast('starToast', 'Star Surge has ended.', 4000);
      updateBoostBar();
    }
    setInterval(spawnFallingStar, STAR_INTERVAL);

    function showFeverToast(msg) {
      var el = $('feverToast');
      el.textContent = msg || 'Personal fever mode is active!';
      el.classList.add('show');
      clearTimeout(feverToastTimer);
      feverToastTimer = setTimeout(function () { el.classList.remove('show'); }, 5000);
    }

    function startFever() {
      feverActive = true;
      // fever lasts as long as the fever song (falls back to 1 minute if it isn't loaded)
      var songMs = window.gameMusic ? window.gameMusic.feverMs() : 0;
      feverUntil = Date.now() + (songMs || FEVER_DURATION);
      $('feverOverlay').classList.add('active');
      showFeverToast();
      if (window.gameMusic) window.gameMusic.setFever(true);
    }

    function endFever() {
      if (!feverActive) return;
      feverActive = false;
      $('feverOverlay').classList.remove('active');
      showFeverToast('Personal fever mode has ended! Generators are returning to their normal speed.');
      if (window.gameMusic) window.gameMusic.setFever(false);
    }

    function addFeverProgress(n) {
      if (feverActive) return; // don't fill the meter while a fever is already running
      feverProgress += n;
      if (feverProgress >= FEVER_TARGET) {
        feverProgress -= FEVER_TARGET;
        startFever();
      }
    }

    // Early Alpha aura: every other gen whose centre is inside an Alpha's 3.5-block circle earns 1.5x.
    // It doesn't stack - a gen inside several auras still gets just one 1.5x.
    function auraMult(o) {
      for (var i = 0; i < gens.length; i++) {
        var g = gens[i];
        if (g === o) continue;
        var gt = typeById(g.typeId);
        if (!gt.auraRadius) continue;
        var dx = o.x - g.x, dy = o.y - g.y;
        if (dx * dx + dy * dy <= gt.auraRadius * gt.auraRadius) return gt.auraMult;
      }
      return 1;
    }
    function noteRate(o) { return o.rate * auraMult(o); }
    function noteText(o) {
      var r = noteRate(o);
      return typeById(o.typeId).currency === 'tix' ? fmtNote(r) + ' Tx' : '$' + fmtNote(r * (1 + multi * 0.01));
    }

    function collect(o, roll) {
      var interval = curInterval(o);
      var n = Math.floor((Date.now() - o.t0) / interval);
      if (n < 1) return 0;
      o.t0 += n * interval; // keep the leftover fraction of a second
      var t = typeById(o.typeId);
      var r = noteRate(o);
      if (t.currency === 'tix') { tix += n * r; formula_use.x(n * r); }
      else {
        var gain = n * r * (1 + multi * 0.01) * (1 + rebirthCount * 0.03);
        money += gain; formula_use.m(gain);
      }
      addXp(o.xp * n);
      addFeverProgress(n);
      if (roll !== false && !t.noMulti) {
        for (var i = 0; i < n; i++) rollMulti(t, o.x, o.y); // one roll per note generated, not per collect
      }
      return n;
    }

    function pulseWave(x, y, scale) {
      var el = document.createElement('div');
      var p = toScreen(x, y);
      el.className = 'pulse-wave';
      el.style.left = p.x + 'px';
      el.style.top = p.y + 'px';
      el.style.setProperty('--wave-scale', scale);
      document.body.appendChild(el);
      setTimeout(function () { el.remove(); }, 700);
    }

    function updateBoostBar() {
      var boostBar = $('boostBar');
      var now = Date.now();
      var active = gens.filter(function (o) { return o.boostUntil && o.boostUntil > now; });
      // Badges are updated in place (not rebuilt) so a hover tooltip doesn't vanish every tick
      var surgeEl = boostBar.querySelector('.boost-badge.surge');
      var pulseEl = boostBar.querySelector('.boost-badge.pulse');
      var feverEl = boostBar.querySelector('.boost-badge.fever');
      if (feverActive) {
        if (!feverEl) {
          feverEl = document.createElement('div');
          feverEl.className = 'boost-badge fever';
          feverEl.setAttribute('data-tip', '2x faster notes');
          feverEl.innerHTML = '&#128293;<br><span class="bb-text"></span>';
          boostBar.appendChild(feverEl);
        }
        feverEl.querySelector('.bb-text').textContent = Math.ceil(Math.max(0, feverUntil - now) / 1000) + 's';
      } else if (feverEl) {
        feverEl.remove();
      }
      var hyperEl = boostBar.querySelector('.boost-badge.hyper');
      var sonicEl = boostBar.querySelector('.boost-badge.sonic');
      if (sonicActive) {
        if (!sonicEl) {
          sonicEl = document.createElement('div');
          sonicEl.className = 'boost-badge sonic';
          sonicEl.setAttribute('data-tip', '2x faster notes');
          sonicEl.innerHTML = '<span class="sonic-icon">&#11088;</span><br><span class="bb-text"></span>';

    function activatePulse(t, b) {

      boosted.forEach(function (o) {
        var oldPending = pending(o); // notes already earned, under the current (pre-boost) interval
        o.boostUntil = until; // interval speeds up from here
        var newInterval = curInterval(o);
        // rebase t0 so the pending count stays exactly the same right now — nothing is
        // collected and nothing extra appears, only the rate going forward changes
        o.t0 = Date.now() - oldPending * newInterval;
        pulseWave(o.x, o.y, 2.5); // a small wave around each gen it actually boosted

    function clampPos(clientX, clientY) {
      var HALF = 28;
      if (isMobile()) {
        var r = fieldScroll.getBoundingClientRect();
        var wx = clientX - r.left + fieldScroll.scrollLeft;
        var wy = clientY - r.top + fieldScroll.scrollTop;
        var maxX = field.offsetWidth - HALF, maxY = field.offsetHeight - HALF - 30;
        return {
          x: Math.min(Math.max(wx, HALF), maxX),
          y: Math.min(Math.max(wy, HALF + 30), Math.max(HALF + 30, maxY))
        };
      }
      return {
        x: Math.min(Math.max(clientX, HALF), window.innerWidth - HALF),
        y: Math.min(Math.max(clientY, HALF + 30), window.innerHeight - HALF)
      };
    }

    function hitGen(o) {
      var now = Date.now();
      if (now - lastHit < HIT_COOLDOWN) return;
      lastHit = now;
      o.hits += 1;
      o.el.classList.remove('hit'); void o.el.offsetWidth; o.el.classList.add('hit');
      if (o.hits < typeById(o.typeId).hits) return;
      // enough hits: a gen pays out what it made first, then it goes back into the inventory
      if (o.kind === 'gen') { collect(o); gens.splice(gens.indexOf(o), 1); }
      else blocks.splice(blocks.indexOf(o), 1);

      owned[o.typeId] += 1;

        if (gt.rate > best) best = gt.rate;

        el.addEventListener('click', function () { if (hammer) hitGen(b); });

      formula_use_screen(_until >= 1e15 ? 0 : _until);
    } else {
      loadGame();
    }
    setInterval(saveGame, 5000);
    if (FORMULA_USE_ON) setInterval(function () { if (!formula_use_flag && formula_use.tick()) formula_use_trip(); }, 500);
    document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') saveGame(); });
    window.addEventListener('pagehide', saveGame);

    buildShop();
    buildUpgrades();
    render();
    updateXp();
    updateMulti();

    // Music: main theme + fever theme (both linked, not embedded). Browsers block
    // audio until the player interacts, so playback starts on the first click/tap/key.
    // Tracks crossfade when swapping; the fever lasts exactly as long as its song.
    (function () {
      var MAIN_VOL = 0.5, FEVER_VOL = 0.5;
      var main = new Audio('https://github.com/hippolover0112-commits/Clowning-around/raw/refs/heads/main/Zalza%20-%20Just%20clowning%20around.mp3');
      var fever = new Audio('https://github.com/hippolover0112-commits/Clowning-around/raw/refs/heads/main/Transformation%E2%98%86Mode!.mp3');
      main.loop = true;  main.volume = MAIN_VOL;
      fever.loop = false; fever.volume = FEVER_VOL;
      fever.preload = 'auto'; // so the song length is known when a fever starts
      var started = false, inFever = false, outro = false;

      function play(a) { var p = a.play(); if (p && p.catch) p.catch(function () {}); }

      function fadeTo(a, target, ms, then) {
        if (a._fade) clearInterval(a._fade);
        var from = a.volume, t0 = Date.now();
        a._fade = setInterval(function () {
          var k = Math.min(1, (Date.now() - t0) / ms);
          a.volume = Math.max(0, Math.min(1, from + (target - from) * k));
          if (k >= 1) { clearInterval(a._fade); a._fade = null; if (then) then(); }
        }, 50);
      }

      function toFever() {
        outro = false;
        fever.currentTime = 0;
        fever.volume = 0;
        var p = fever.play();
        function go() { fadeTo(fever, FEVER_VOL, 1000); fadeTo(main, 0, 1000, function () { main.pause(); }); }
        if (p && p.then) p.then(go).catch(function () {}); else go();
      }

      function toMain(ms) {
        if (main.paused) { main.volume = 0; play(main); }
        fadeTo(main, MAIN_VOL, ms);
        fadeTo(fever, 0, ms, function () { fever.pause(); });
      }

      // Start the crossfade back to the main theme during the last seconds of the fever song
      fever.addEventListener('timeupdate', function () {
        if (!inFever || outro || !isFinite(fever.duration)) return;
        var left = fever.duration - fever.currentTime;
        if (left <= 3) { outro = true; toMain(Math.max(500, left * 1000)); }
      });
      fever.addEventListener('ended', function () {
        if (window.feverActive) endFever();
      });

      function firstInteraction() {
        if (started) return;
        started = true;
        document.removeEventListener('click', firstInteraction);
        document.removeEventListener('touchend', firstInteraction);
        document.removeEventListener('keydown', firstInteraction);
        if (inFever) toFever(); else play(main);
      }
      // 'click'/'touchend' (not 'pointerdown') so this counts as a real user gesture on every
      // browser -- iOS/Android browsers can silently refuse autoplay on the earlier pointerdown,
      // which is why the main theme used to stay silent until the first fever kicked it awake.
      document.addEventListener('click', firstInteraction);
      document.addEventListener('touchend', firstInteraction);
      document.addEventListener('keydown', firstInteraction);

      window.gameMusic = {
        setFever: function (on) {
          if (inFever === on) return;
          inFever = on;
          if (!started) return;
          if (on) toFever(); else toMain(outro ? 500 : 2000);
        },
        feverMs: function () {
          return started && isFinite(fever.duration) && fever.duration > 0 ? fever.duration * 1000 : 0;
        },
        feverPlaying: function () {
          return started && inFever && !fever.paused && !fever.ended && !fever.error;
        }
      };
    })();
  </script>
</body>
</html>
